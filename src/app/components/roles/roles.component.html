<p>roles works!</p>

<div class="row">
    <div class="col-3">
        <p>{{firstName}}</p>    <!--interpollation to display .ts variable data-->
    </div>
    <div class="col-3">
        <p>{{version}}</p>
    </div>
    <div class="col-3">
        <p>{{currentDate}}</p>
    </div>
    <div class="col-3">
        <p>{{selectedState}}</p>
    </div>
</div>

<div class="row">
    <div class="col-3">
        <input type="text" [value]="firstName" class="form-control" />  <!--property binding-->
    </div>
    <div class="col-3">
        <input type="text" [(ngModel)]="firstName" />   <!--Two way data binding with directive-->
    </div>
    <div class="col-3">
        <input [type]="inputType" />
    </div>
    <div class="col-3">
        <select [(ngModel)]="selectedState">
            <option value="MH">MH</option>
            <option value="MP">MP</option>
            <option value="Goa">Goa</option>
        </select>
    </div>
</div>
<div class="row">
    <div class="col-3">
        <button class="btn btn-success" (click)="showWelcomeAlert()">Show alert</button>  <!--Event Binding-->
    </div>
    <div class="col-3">
        <button class="btn btn-success" (click)="showMessage('Welcome React')">Show react message</button>
    </div>
    <div class="col-3">
        <button class="btn btn-success" (click)="showMessage('Welcome DotNet')">Show dotNet message</button>
    </div>
</div>
